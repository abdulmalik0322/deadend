<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DEADEND</title>
    <script>
      // GitHub Pages SPA fallback: stash the deep link and reload the app root.
      try {
        sessionStorage.setItem(
          'deadend-redirect',
          location.pathname + location.search + location.hash
        );
      } catch (e) {}
      location.replace('/deadend/');
    </script>
  </head>
  <body></body>
</html>
